name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'
      - '!main'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Nombre del job = check requerido en branch protection de main
  all-checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile, test and package
        run: mvn -B verify
