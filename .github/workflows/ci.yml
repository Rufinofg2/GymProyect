name: CI Pipeline

# Se ejecuta:
#  - En cada Pull Request que apunte a main (esto es lo que la branch protection va a exigir)
#  - En cada push a cualquier rama feature/* (feedback rápido mientras se desarrolla)
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'
      - '!main'   # main nunca recibe push directo (lo bloquea la branch protection), pero por las dudas no re-disparamos CI ahí

# Cancela ejecuciones anteriores del mismo PR/rama si llega un nuevo commit
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_DISTRIBUTION: 'temurin'

jobs:

  # ────────────────────────────────
  # 1. LINT / ANÁLISIS ESTÁTICO
  # ────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: '21'
          cache: 'maven'

      - name: Run Checkstyle
        run: mvn -B checkstyle:check
        continue-on-error: false

  # ────────────────────────────────
  # 2. TESTS UNITARIOS + COBERTURA
  # ────────────────────────────────
  test:
    name: Unit Tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Spring Boot 4.1 + <java.version>21</java.version> → solo JDK 21
        java: ['21']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Run tests with coverage
        run: mvn -B test jacoco:report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results (JDK ${{ matrix.java }})
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

  # ────────────────────────────────
  # 3. BUILD / PACKAGE
  # ────────────────────────────────
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: '21'
          cache: 'maven'

      - name: Build package (sin re-correr tests)
        run: mvn -B package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 14

  # ────────────────────────────────
  # 4. SEGURIDAD: DEPENDENCIAS Y VULNERABILIDADES
  # ────────────────────────────────
  security-scan:
    name: Dependency & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (vulnerabilidades conocidas)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

  # ────────────────────────────────
  # 5. GATE FINAL — este es el único check que hay que
  #    marcar como "required" en la branch protection.
  # ────────────────────────────────
  all-checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, test, build, security-scan]
    if: always()
    steps:
      - name: Verificar resultado de todos los jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "❌ Uno o más jobs fallaron. Bloqueando merge."
            exit 1
          fi
          echo "✅ Todos los checks pasaron correctamente."
